[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "php-to-csharp-migration-harness"
version = "0.1.0"
description = "A bounded-context harness for PHP to C# migration with Junie CLI"
requires-python = ">=3.11"
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = [
  "tomlkit>=0.13,<1",
]

[project.scripts]
php-to-csharp-harness = "migration_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"migration_harness.verification" = ["roslyn_program.cs"]
# ダッシュボードのJavaScriptは、インストール後もPythonモジュールから配信する。
"migration_harness.web" = ["dashboard.js", "dashboard_editor.js", "dashboard_runs.js", "dashboard_settings.js", "dashboard_log_presentation.js", "dashboard_chat.js", "dashboard_rule_workspace.js", "monaco/*.js", "monaco/*.css", "monaco/LICENSE", "monaco/ThirdPartyNotices.txt"]

[tool.setuptools.data-files]
# 本番とデモが共用するHTMLを、作業ツリーの外からも読み込める場所に置く。
"share/php-to-csharp-harness" = ["progress-demo.html", "harness.example.toml"]
"share/php-to-csharp-harness/tools" = ["tools/copy_migration_draft.py"]

"share/php-to-csharp-harness/.junie/skills/harness-optimize-rules" = [".junie/skills/harness-optimize-rules/SKILL.md"]
"share/php-to-csharp-harness/.junie/skills/harness-optimize-rules/references" = [".junie/skills/harness-optimize-rules/references/plan-format.md", ".junie/skills/harness-optimize-rules/references/loading-policy.md", ".junie/skills/harness-optimize-rules/references/register-new.md"]
