[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "php-to-csharp-migration-harness"
version = "0.1.0"
description = "A bounded-context harness for PHP to C# migration with Junie CLI"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
]

[project.scripts]
php-to-csharp-harness = "migration_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
