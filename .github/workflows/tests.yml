name: Harness tests

on:
  push:
    # Managed Issue candidates require both push and PR checks.
    branches: [main, "codex/issue-*"]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ format('windows tests ({0}, {1})', matrix.python, matrix.suite) }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        suite: [conversation-editor, remaining]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-dotnet@v4
        if: matrix.suite != 'conversation-editor'
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        if: matrix.suite != 'conversation-editor'
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - if: matrix.suite != 'conversation-editor'
        name: Run regression tests with required Node and browser coverage
        env:
          TEST_SHARD: ${{ matrix.suite }}
        run: |
          node --version
          python tests/run_shard.py "$env:TEST_SHARD" --require-ui --timings
      - if: matrix.suite == 'conversation-editor'
        run: python tests/run_shard.py conversation-editor --timings
      - if: matrix.suite != 'conversation-editor'
        run: python -m unittest discover -s .github/codex -v

  windows-regression:
    name: regression (windows-latest, ${{ matrix.python }})
    needs: regression
    if: always()
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    runs-on: windows-latest
    steps:
      - name: Require successful regression shards
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
        run: |
          if ($env:REGRESSION_RESULT -ne "success") {
            throw "Windows regression failed: $env:REGRESSION_RESULT"
          }

  windows-junie:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Install the verified Junie build
        shell: pwsh
        env:
          JUNIE_VERSION: "4020.10"
        run: |
          Invoke-WebRequest https://junie.jetbrains.com/install.ps1 -OutFile "$env:RUNNER_TEMP/install-junie.ps1"
          & "$env:RUNNER_TEMP/install-junie.ps1"
          "$env:USERPROFILE/.local/bin" >> $env:GITHUB_PATH
      # 起動だけを検証する。認証情報もモデルへのリクエストも不要。
      - run: python tests/smoke_windows_junie.py
