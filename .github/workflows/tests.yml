name: Harness tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        # Windows固有の改行と、最低対応版のPythonをCIで確認する。
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  windows-junie:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Install the verified Junie build
        shell: pwsh
        env:
          JUNIE_VERSION: "4020.10"
        run: |
          Invoke-WebRequest https://junie.jetbrains.com/install.ps1 -OutFile "$env:RUNNER_TEMP/install-junie.ps1"
          & "$env:RUNNER_TEMP/install-junie.ps1"
          "$env:USERPROFILE/.local/bin" >> $env:GITHUB_PATH
      # 起動だけを検証する。認証情報もモデルへのリクエストも不要。
      - run: python tests/smoke_windows_junie.py
