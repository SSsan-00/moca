name: Harness tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os == 'windows-latest' && format('windows tests ({0}, {1})', matrix.python, matrix.suite) || format('regression ({0}, {1})', matrix.os, matrix.python) }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.11", "3.13"]
        suite: [conversation, remaining]
        include:
          - os: ubuntu-latest
            python: "3.11"
            suite: full
          - os: ubuntu-latest
            python: "3.13"
            suite: full
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        if: matrix.suite != 'conversation'
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - if: matrix.suite != 'conversation'
        name: Run regression tests with required Node and browser coverage
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.suite }}
        run: |
          node --version
          python tests/run_shard.py "$TEST_SHARD" --require-ui
      - if: matrix.suite == 'conversation'
        run: python tests/run_shard.py conversation
      - if: matrix.suite != 'conversation'
        run: python -m unittest discover -s .github/codex -v

  windows-regression:
    # Keep the required check names and report failure if any regression shard failed.
    name: regression (windows-latest, ${{ matrix.python }})
    needs: regression
    if: always()
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful regression shards
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
        run: test "$REGRESSION_RESULT" = success

  windows-junie:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Install the verified Junie build
        shell: pwsh
        env:
          JUNIE_VERSION: "4020.10"
        run: |
          Invoke-WebRequest https://junie.jetbrains.com/install.ps1 -OutFile "$env:RUNNER_TEMP/install-junie.ps1"
          & "$env:RUNNER_TEMP/install-junie.ps1"
          "$env:USERPROFILE/.local/bin" >> $env:GITHUB_PATH
      # 起動だけを検証する。認証情報もモデルへのリクエストも不要。
      - run: python tests/smoke_windows_junie.py
