[project]
# アプリはこのハーネスの外に置く。worktreeとRunの保存先は、アプリとも分ける。
root = "C:/path/to/application-repository"
# worktreeは既定で現在のHEADから作る。別のGitリビジョンを使う場合だけ指定する。
# base_ref = "main"
worktree_root = "C:/path/to/local-migration-worktrees"
run_root = "C:/path/to/local-migration-runs"
# 上限は文字数で指定する。トークン数の厳密な制限ではない。
max_context_chars = 100000

# ルールと参考実装は全移行単位に適用する。行範囲の省略時は全文を渡す。
# [[project.migration_rules]]
# path = "docs/migration-rules.md"
#
# [[project.references]]
# role = "reference_php"
# path = "docs/examples/menu/menu.php"
#
# [[project.references]]
# role = "reference_csharp"
# path = "docs/examples/menu/Menu.cs"

[junie]
# 任意の正の整数。省略するとJunie CLI側の設定に従う。
# max_steps = 20

[build]
# worktreeからの相対パス。省略時はworktree直下でdotnet buildを実行する。
# project = "src/Application/Application.csproj"

[checker]
# 実行ファイル名と引数を個別に並べる。相対パスの基準はworktreeのルート。
# command = ["py", "-3.11", "tools/check_migration.py"]
# 既定はRunごとに最大2回。0なら自動修正せず人の確認に回す。
# max_repair_attempts = 2

[scripts]
# 各工程に、実行ファイルと引数の配列を実行順で指定する。
# before_prepare = [["powershell.exe", "-NoProfile", "-File", "tools/prepare-legacy.ps1"]]
# after_build = [["py", "-3.11", "tools/export_results.py"]]

[diff_viewer]
# 単一HTMLの相対パスを指定すると、比較とアンカー生成が有効になる。
# html = "tools/dist/index.min.html"
# HTMLのパスを保存したまま無効にする場合に指定する。
# enabled = false

[[units]]
id = "メニュー"
source = "php/menu.php"
targets = ["Pages/Menu.cshtml.cs", "Pages/Menu.cshtml"]
# 移行先が1ファイルの場合は、targetsの代わりに target = "Pages/Menu.cshtml.cs" を使う。
# 文字コードの自動判定が曖昧なときは source_encoding = "euc-jp" などを指定する。
