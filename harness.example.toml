[project]
# アプリはこのハーネスの外に置く。worktreeとRunの保存先は、アプリとも分ける。
# root / worktree_root / run_root は絶対パス、または設定ファイルの場所からの相対パス。
root = "C:/path/to/application-repository"
# worktreeは既定で現在のHEADから作る。別のGitリビジョンを使う場合だけ指定する。
# base_ref = "main"
worktree_root = "C:/path/to/local-migration-worktrees"
run_root = "C:/path/to/local-migration-runs"
# 上限は文字数で指定する。トークン数の厳密な制限ではない。
max_context_chars = 500000

# 必須ルールは全文をJunie起動時の指示に渡す。詳細・例と参考実装は必要な範囲を読む。
# ルールと参考実装は全行を読み込む。参考実装は元PHPの直後に対応するC#／Razorを並べる。
# ファイルはアプリルートからの相対パス、または外部ファイルの絶対パス。
# [[project.migration_rules]]
# path = "docs/migration-rules.md"
# usage = "required" # 省略時も必須事項。本文を省略せず毎回適用する。
#
# [[project.migration_rules]]
# path = "docs/migration/razor-examples.md"
# usage = "reference"
# description = "Razor画面を移行・修正するときに読む、画面表示の詳細と例"
#
# [[project.references]]
# role = "reference_php"
# path = "docs/examples/menu/menu.php"
#
# [[project.references]]
# role = "reference_csharp"
# path = "docs/examples/menu/Menu.cs"

[junie]
# 設定タブでも選択可能。省略するとJunieの既定モデルを使う。
# model = "sonnet"
# モデルを指定した場合のみ使用。省略すると選択モデルの既定値を使う。
# effort = "high"
# 任意の正の整数。省略するとJunie CLI側の設定に従う。
# max_steps = 20
# 起動ごとの最終指示と同梱ガイドラインの合計（UTF-8 バイト）。省略で無効、0は不可。
# 設定値の例であり、モデルの推奨値ではありません。
# warn_input_bytes = 1048576
# max_input_bytes = 2097152

[target_context]
# 省略時の起点は以下の4箇所。roots = [] にすると既定起点のみ無効。
# roots = ["target_parent", "inc", "Libs", "Extensions"]
# 追加フォルダーは worktree からの相対パス。除外は相対パス・パターン。
# folders = ["src/Shared"]
# exclude = ["bin", "obj", "*.zip"]
# recursive = false
# 省略で上限なし。0は0件・0バイト。
# max_files = 500
# max_bytes = 10485760
# max_file_bytes = 1048576

[build]
# アプリルートからの相対パス、またはアプリリポジトリ内の絶対パス。
# worktree内のパスへ正規化し、元のリポジトリには書き込まない。省略時はworktree直下でdotnet build。
# project = "src/Application/Application.csproj"

[checker]
# 実行ファイル名と引数を個別に並べる。相対パスの基準はworktreeのルート。
# command = ["py", "-3", "tools/check_migration.py"]
# 引数の別名は実行時にworktree内の絶対パスへ展開する。
# {build_project}: [build].project（設定必須）、{target}: 移行先の先頭、{worktree}: worktreeルート。
# command = ["py", "-3", "tools/check_migration.py", "--project", "{build_project}", "--target", "{target}"]
# ビルドとチェッカーの修正を合わせて、既定はRunごとに最大2回。中断した試行は数えない。
# 0は自動修正なし。
# max_repair_attempts = 2

[scripts]
# 各工程に、実行ファイルと引数の配列を実行順で指定する。
# 通常コマンドではチェッカーと同じ別名を使える（before_prepareと@copy-migration-draftを除く）。
# after_build = [["py", "-3", "tools/export_results.py", "{build_project}", "{target}"]]
# before_prepare = [["powershell.exe", "-NoProfile", "-File", "tools/prepare-legacy.ps1"]]
# after_build = [["py", "-3", "tools/export_results.py"]]

[diff_viewer]
# 単一HTMLを指定すると、比較とアンカー生成が有効になる。空欄なら無効。
# アプリルートからの相対パス、または外部ファイルの絶対パス。
# html = "tools/dist/index.min.html"
# HTMLのパスを保存したまま無効にする場合に指定する。
# enabled = false
# Junieの対応行の手本にするDiff ViewerワークスペースJSON。複数指定した場合はすべて使う。
# 絶対パス、または設定ファイルの場所からの相対パス。空欄・省略時は同じRunの確認済み対応例を自動参照。
# 指定ファイルがない・JSONが不正な場合はエラーになり、自動参照へは切り替えない。
# anchor_reference = ["references/orders.workspace.json", "references/products.workspace.json"]

[[units]]
id = "メニュー"
# アプリルートからの相対パス、または外部ファイルの絶対パス。拡張子なしを含め、拡張子を問わず移行元PHPとして読む。
source = "php/menu.php"
# アプリルートからの相対パス、またはアプリ内の絶対パス。worktree内へ正規化し、元のリポジトリには書き込まない。
targets = ["Pages/Menu.cshtml.cs", "Pages/Menu.cshtml"]
# この移行単位の仮C#／Razorのコピー元。アプリルートからの相対パス、または外部ファイルの絶対パス。
# 移行先が複数なら拡張子で照合し、Junie移行前にworktreeへ取り込む。
# draft_imports = ["C:/draft/generated/Menu.cshtml.cs", "C:/draft/generated/Menu.cshtml"]
# この移行単位だけで使うチェッカー。省略時は [checker].command を使う。
# --checker-command を指定した場合は、CLIのコマンドを優先する。
# checker_command = ["py", "-3", "tools/check_menu.py"]
# Razorページは同じ場所・同じ名前の .cshtml と .cshtml.cs を両方指定する。
# 通常のC#ファイル1つなら target = "Menu.cs" でも指定できる。
# 文字コードの自動判定が曖昧なときは source_encoding = "euc-jp" などを指定する。

# [units.target_context]
# 共通設定の指定項目だけ上書き。配列は置き換え、省略した項目は継承。
# roots = []
