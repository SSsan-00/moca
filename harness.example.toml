[project]
# アプリと生成データはこのリポジトリの外に置く。
root = "C:/path/to/application-repository"
base_ref = "main"
worktree_root = "C:/path/to/local-migration-worktrees"
run_root = "C:/path/to/local-migration-runs"
max_context_chars = 30000
# 上限は文字数で指定する。トークン数の厳密な制限ではない。

[junie]
# 任意の正の整数。省略するとJunie CLI側の設定に従う。
# max_steps = 20

[[units]]
id = "example-page"
target = "Pages/Example.cshtml"

[[units.inputs]]
role = "annotated_php"
path = "php/example.php"
start_line = 1
end_line = 120

[[units.inputs]]
role = "provisional_csharp"
path = "Pages/Example.cshtml"
start_line = 1
end_line = 140

# 移行元PHP、必要なルール抜粋、小さな既存C#例は[[units.inputs]]で追加する。
# すべての入力範囲を明示する。
